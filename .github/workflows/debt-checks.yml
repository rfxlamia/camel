name: Debt Checks

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key-collision:
    name: Key Collision Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://camel:camel@localhost:5432/camel_kanban
      ANTHROPIC_API_KEY: test-not-a-real-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: camel
          POSTGRES_PASSWORD: camel
          POSTGRES_DB: camel_kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check:key-collisions --workspace=server
